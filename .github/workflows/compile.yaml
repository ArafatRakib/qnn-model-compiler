name: Compile NPU Context Binary

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: 'HuggingFace Repository ID'
        required: true
        default: 'onnx-community/Qwen2.5-Coder-3B-Instruct'
      hf_model_file:
        description: 'Relative path to main .onnx file in repo'
        required: true
        default: 'onnx/model_q4.onnx'
      hf_data_file:
        description: 'Relative path to .onnx_data file in repo'
        required: false
        default: 'onnx/model_q4.onnx_data'

jobs:
  qualcomm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qai-hub onnx huggingface_hub

      - name: Configure Qualcomm AI Hub Credentials
        env:
          QAI_HUB_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_TOKEN

      - name: Run Qualcomm AI Hub Compiler
        env:
          HF_REPO_ID: ${{ github.event.inputs.hf_repo }}
          HF_MODEL_FILE: ${{ github.event.inputs.hf_model_file }}
          HF_DATA_FILE: ${{ github.event.inputs.hf_data_file }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python compile.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-coder-qnn-onnx
          path: qwen_coder_qnn.onnx
