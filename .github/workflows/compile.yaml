name: Compile NPU Context Binary

on:
  workflow_dispatch:

jobs:
  qualcomm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qai-hub onnx

      - name: Configure Qualcomm AI Hub Credentials
        env:
          QAI_HUB_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_TOKEN

      - name: Download Q4 ONNX Model & Data Files
        run: |
          echo "Downloading Q4 ONNX Model structure..."
          wget -O model.onnx "https://huggingface.co/onnx-community/Qwen2.5-Coder-3B-Instruct/resolve/main/onnx/model_q4.onnx"
          
          echo "Downloading Q4 ONNX Weight data..."
          wget -O model.onnx_data "https://huggingface.co/onnx-community/Qwen2.5-Coder-3B-Instruct/resolve/main/onnx/model_q4.onnx_data"

      - name: Run Qualcomm AI Hub Compiler
        run: |
          python compile.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-coder-3b-qnn-onnx
          path: qwen_coder_qnn.onnx
