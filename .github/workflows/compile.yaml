name: Compile NPU Context Binary

on:
  workflow_dispatch:
    inputs:
      onnx_url:
        description: 'Direct URL to main .onnx file'
        required: true
        default: 'https://huggingface.co/onnx-community/Qwen2.5-Coder-3B-Instruct/resolve/main/onnx/model_q4.onnx'
      onnx_data_url:
        description: 'Direct URL to .onnx_data file (optional/for large models)'
        required: false
        default: 'https://huggingface.co/onnx-community/Qwen2.5-Coder-3B-Instruct/resolve/main/onnx/model_q4.onnx_data'

jobs:
  qualcomm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qai-hub onnx

      - name: Configure Qualcomm AI Hub Credentials
        env:
          QAI_HUB_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_TOKEN

      - name: Download ONNX Model Files
        run: |
          echo "Downloading main ONNX file from: ${{ github.event.inputs.onnx_url }}"
          wget -O model.onnx "${{ github.event.inputs.onnx_url }}"

          if [ -n "${{ github.event.inputs.onnx_data_url }}" ]; then
            echo "Downloading ONNX weight data file from: ${{ github.event.inputs.onnx_data_url }}"
            wget -O model.onnx_data "${{ github.event.inputs.onnx_data_url }}"
          fi

      - name: Run Qualcomm AI Hub Compiler
        run: |
          python compile.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-coder-qnn-onnx
          path: qwen_coder_qnn.onnx
